<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>demotopassAR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    a-scene {
      position: fixed !important;
      top: 0;
      left: 0;

      width: 100% !important;
      height: 100% !important;
    }

  </style>


  <!-- ==================================================
       白背景を透明にするカスタムコンポーネント
  =================================================== -->

  <script>

    AFRAME.registerComponent("white-transparent-video", {

      schema: {

        src: {
          type: "selector"
        }

      },


      init: function () {

        const el = this.el;
        const video = this.data.src;


        console.log("白背景透明化Video初期化");


        // =================================================
        // VideoTexture
        // =================================================

        const texture =
          new THREE.VideoTexture(video);


        texture.minFilter =
          THREE.LinearFilter;

        texture.magFilter =
          THREE.LinearFilter;

        texture.generateMipmaps = false;


        // sRGB対応
        if ("colorSpace" in texture) {

          if (THREE.SRGBColorSpace !== undefined) {

            texture.colorSpace =
              THREE.SRGBColorSpace;

          }

        }


        // =================================================
        // Shader
        // =================================================

        const vertexShader = `

          varying vec2 vUv;

          void main() {

            vUv = uv;

            gl_Position =
              projectionMatrix *
              modelViewMatrix *
              vec4(position, 1.0);

          }

        `;


        const fragmentShader = `

          uniform sampler2D uVideo;

          // 白と判定する境界
          uniform float uThreshold;

          // 境界を滑らかにする範囲
          uniform float uSoftness;

          varying vec2 vUv;


          void main() {

            // 動画の色を取得
            vec4 color =
              texture2D(uVideo, vUv);


            // -----------------------------------------
            // 白さを判定
            //
            // R,G,Bすべてが高いほど「白」
            // minを使うことで、
            // 赤や肌色などの色は残しやすくする
            // -----------------------------------------

            float whiteness =
              min(
                color.r,
                min(color.g, color.b)
              );


            // -----------------------------------------
            // 白 → 透明
            // 色のある部分 → 不透明
            // -----------------------------------------

            float alpha =
              1.0 - smoothstep(
                uThreshold - uSoftness,
                uThreshold + uSoftness,
                whiteness
              );


            // 完全に透明なら描画しない
            if (alpha < 0.01) {

              discard;

            }


            gl_FragColor =
              vec4(
                color.rgb,
                alpha
              );

          }

        `;


        // =================================================
        // ShaderMaterial
        // =================================================

        const material =
          new THREE.ShaderMaterial({

            uniforms: {

              uVideo: {
                value: texture
              },

              // -----------------------------------------
              // 白判定の強さ
              // -----------------------------------------
              //
              // 数値を下げる
              // → 少し暗い白も透明になる
              //
              // 数値を上げる
              // → 真っ白だけ透明になる
              //

              uThreshold: {
                value: 0.85
              },


              // -----------------------------------------
              // 境界の滑らかさ
              // -----------------------------------------

              uSoftness: {
                value: 0.08
              }

            },


            vertexShader:
              vertexShader,

            fragmentShader:
              fragmentShader,


            transparent: true,

            depthWrite: false,

            depthTest: true,

            side: THREE.DoubleSide

          });


        // =================================================
        // Plane
        // =================================================

        const geometry =
          new THREE.PlaneGeometry(
            1,
            1.7778
          );


        const mesh =
          new THREE.Mesh(
            geometry,
            material
          );


        // 透明動画を前面に出す
        mesh.renderOrder = 10;


        // A-Frameに登録
        el.setObject3D(
          "mesh",
          mesh
        );


        // 保存
        this.texture = texture;

        this.material = material;

        this.mesh = mesh;


        console.log(
          "白背景透明化Mesh作成完了"
        );

      },


      remove: function () {

        if (this.texture) {

          this.texture.dispose();

        }


        if (this.material) {

          this.material.dispose();

        }


        if (this.mesh) {

          this.mesh.geometry.dispose();

        }


        this.el.removeObject3D(
          "mesh"
        );

      }

    });

  </script>

</head>


<body>


  <!-- ==================================================
       AR Scene
  =================================================== -->

  <a-scene

    mindar-image="imageTargetSrc: targets.mind;"

    embedded

    color-space="sRGB"

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false">


    <!-- ==================================================
         動画
    =================================================== -->

    <a-assets>

      <video

        id="demoVideo"

        src="demo_alpha.webm"

        preload="auto"

        loop

        playsinline

        webkit-playsinline

        muted>

      </video>

    </a-assets>


    <!-- ==================================================
         カメラ
    =================================================== -->

    <a-camera

      position="0 0 0"

      look-controls="enabled: false">

    </a-camera>


    <!-- ==================================================
         MindAR Target
    =================================================== -->

    <a-entity

      id="target"

      mindar-image-target="targetIndex: 0">


      <!-- ==================================================
           白背景透明化動画
      ================================================== -->

      <a-entity

        id="teacherVideo"

        white-transparent-video="src: #demoVideo"

        position="0 0 0">

      </a-entity>


    </a-entity>


  </a-scene>



  <!-- ==================================================
       JavaScript
  =================================================== -->

  <script>


    const video =
      document.querySelector("#demoVideo");


    const target =
      document.querySelector("#target");


    // =================================================
    // ターゲット発見
    // =================================================

    target.addEventListener(
      "targetFound",
      () => {

        console.log(
          "先生の写真を認識しました"
        );


        // 動画を最初に戻す

        video.currentTime = 0;


        // ---------------------------------------------
        // 最初はミュート
        // スマホの自動再生対策
        // ---------------------------------------------

        video.muted = true;


        video.play()

          .then(() => {

            console.log(
              "透過動画 再生開始"
            );

          })

          .catch((error) => {

            console.log(
              "自動再生エラー:",
              error
            );

          });

      }
    );


    // =================================================
    // ターゲットを見失った
    // =================================================

    target.addEventListener(
      "targetLost",
      () => {

        console.log(
          "ターゲットを見失いました"
        );

        // 必要なら停止
        // video.pause();

      }
    );


    // =================================================
    // 画面タップ
    // 音声ON
    // =================================================

    let soundEnabled = false;


    async function enableSound() {

      try {

        video.muted = false;

        await video.play();

        soundEnabled = true;


        console.log(
          "音声付き動画再生"
        );

      }

      catch (error) {

        console.log(
          "音声付き再生エラー:",
          error
        );

      }

    }


    // PC
    document.body.addEventListener(
      "click",
      enableSound,
      {
        once: true
      }
    );


    // スマホ
    document.body.addEventListener(
      "touchstart",
      enableSound,
      {
        once: true,
        passive: true
      }
    );


    // =================================================
    // 動画読み込み確認
    // =================================================

    video.addEventListener(
      "loadeddata",
      () => {

        console.log(
          "動画読み込み完了"
        );

        console.log(
          "動画サイズ:",
          video.videoWidth,
          "x",
          video.videoHeight
        );

      }
    );


    // =================================================
    // 動画エラー
    // =================================================

    video.addEventListener(
      "error",
      () => {

        console.error(
          "動画読み込みエラー:",
          video.error
        );

      }
    );


    // =================================================
    // Scene読み込み
    // =================================================

    const scene =
      document.querySelector("a-scene");


    scene.addEventListener(
      "loaded",
      () => {

        console.log(
          "A-Frame / MindAR 読み込み完了"
        );

      }
    );


  </script>

</body>
</html>
