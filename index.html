<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>demotopassAR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    a-scene {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: targets.mind;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- =========================
         透過VP9 WebM
    ========================== -->
    <a-assets>

      <video
        id="demoVideo"
        src="demo_alpha.webm"
        preload="auto"
        loop
        playsinline
        webkit-playsinline>
      </video>

    </a-assets>


    <!-- =========================
         カメラ
    ========================== -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- =========================
         画像認識
    ========================== -->
    <a-entity mindar-image-target="targetIndex: 0">

      <a-video
        id="teacherVideo"
        src="#demoVideo"
        width="1"
        height="1.7778"
        position="0 0 0"
        material="
          shader: flat;
          transparent: true;
          alphaTest: 0.01;
          side: double;
        ">
      </a-video>

    </a-entity>

  </a-scene>


  <script>

    const video = document.querySelector("#demoVideo");
    const teacherVideo = document.querySelector("#teacherVideo");
    const scene = document.querySelector("a-scene");


    // ========================================
    // 動画テクスチャ読み込み後に透明設定
    // ========================================

    teacherVideo.addEventListener("materialtextureloaded", () => {

      const mesh = teacherVideo.getObject3D("mesh");

      if (!mesh) return;

      const material = mesh.material;

      if (material) {

        material.transparent = true;

        // 半透明部分を表示
        material.alphaTest = 0.01;

        // 透明部分が深度を書き込まないようにする
        material.depthWrite = false;

        material.needsUpdate = true;

      }

      console.log("透過動画テクスチャ読み込み完了");

    });


    // ========================================
    // ターゲットを認識
    // ========================================

    const target = document.querySelector(
      '[mindar-image-target="targetIndex: 0"]'
    );


    target.addEventListener("targetFound", () => {

      console.log("先生の写真を認識しました");

      video.currentTime = 0;

      // 自動再生を試す
      video.play().catch((error) => {

        console.log("自動再生できませんでした:", error);

      });

    });


    // ========================================
    // ターゲットを見失った
    // ========================================

    target.addEventListener("targetLost", () => {

      console.log("ターゲットを見失いました");

      // 必要ならここで一時停止
      // video.pause();

    });


    // ========================================
    // タップで音声付き再生
    // ========================================

    async function startVideo() {

      try {

        video.muted = false;

        await video.play();

        console.log("動画再生開始");

      } catch (error) {

        console.log("動画再生エラー:", error);

      }

    }


    // PC
    document.body.addEventListener("click", startVideo);


    // スマホ
    document.body.addEventListener("touchstart", startVideo);


  </script>

</body>
</html>
