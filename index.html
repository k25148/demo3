<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>demotopassAR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    a-scene {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: targets.mind;"
    embedded
    color-space="sRGB"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- 動画 -->
    <a-assets>

      <video
        id="demoVideo"
        src="demo_alpha.webm"
        preload="auto"
        loop
        playsinline
        webkit-playsinline>
      </video>

    </a-assets>


    <!-- カメラ -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- ARターゲット -->
    <a-entity mindar-image-target="targetIndex: 0">

      <a-video
        id="teacherVideo"
        src="#demoVideo"
        width="1"
        height="1.7778"
        position="0 0 0"
        material="shader: flat; transparent: true;">
      </a-video>

    </a-entity>

  </a-scene>


  <script>

    const video = document.querySelector("#demoVideo");
    const teacherVideo = document.querySelector("#teacherVideo");

    // ========================================
    // 動画テクスチャ読み込み
    // ========================================

    teacherVideo.addEventListener("materialtextureloaded", () => {

      console.log("動画テクスチャ読み込み完了");

      const mesh = teacherVideo.getObject3D("mesh");

      if (mesh && mesh.material) {

        mesh.material.transparent = true;
        mesh.material.depthWrite = false;
        mesh.material.needsUpdate = true;

      }

    });


    // ========================================
    // ターゲット認識
    // ========================================

    const target = document.querySelector(
      '[mindar-image-target="targetIndex: 0"]'
    );

    target.addEventListener("targetFound", () => {

      console.log("ターゲット認識");

      video.currentTime = 0;

      video.play().then(() => {

        console.log("動画再生開始");

      }).catch((error) => {

        console.log("再生エラー:", error);

      });

    });


    // ========================================
    // タップで再生
    // ========================================

    document.body.addEventListener("click", async () => {

      try {

        await video.play();

        console.log("タップによる動画再生");

      } catch (error) {

        console.log("再生できません:", error);

      }

    });


    document.body.addEventListener("touchstart", async () => {

      try {

        await video.play();

        console.log("タッチによる動画再生");

      } catch (error) {

        console.log("再生できません:", error);

      }

    });

  </script>

</body>
</html>
